name: Update Wire Quiz

on:
  schedule:
    # Runs every 15 minutes, 24/7, on GitHub's own servers —
    # keeps updating even if no one has the site open.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate quiz from live news
        run: node scripts/generate-quiz.js

      - name: Commit updated quiz-data.json
        run: |
          git config user.name "wire-quiz-bot"
          git config user.email "actions@users.noreply.github.com"
          git add quiz-data.json
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Auto-update quiz data [skip ci]"
          git push
